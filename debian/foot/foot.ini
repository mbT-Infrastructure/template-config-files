font=DejaVu Sans Mono:size=11
dpi-aware=no
pad=4x4
title=Terminal
bold-text-in-bright=no
term=xterm-256color
[scrollback]
lines=10000
indicator-position=relative
[cursor]
style=block
blink=no
[key-bindings]
color-theme-toggle=Control+Shift+g
pipe-command-output=[code --new-window -] Control+Shift+i
pipe-selected=[bash -c 'PROMPT="I selected the following in my terminal:%0A\`\`\`%0A$(cat)%0A\`\`\`%0A"; xdg-open "${AI_CHAT_URL}/?model=${AI_MODEL:-default}&q=$PROMPT&submit=false"'] Control+Shift+j
prompt-prev=Control+Page_Up
prompt-next=Control+Page_Down
search-start=Control+Shift+f
[search-bindings]
commit=Control+Shift+f
find-prev=Shift+Return Shift+KP_Enter
find-next=Return KP_Enter
